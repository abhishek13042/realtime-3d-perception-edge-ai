# Spec 05.4 R2: by-eye review of the rule-selected failure gallery (benchmarks/results/failure_gallery_*.png).
# One primary category per item, from perception.eval.failures.CATEGORIES. Reviewed 2026-11-11 from the rendered
# panels plus the per-item numbers (estimated Z, GT Z, GT 2D-3D link IoU) in benchmarks/results/failure_gallery.json.
# "GT-box problem" covers three cases, named in each note: a weak 2D-3D GT link (link IoU < 0.3, so the GT centre
# probably belongs to a different instance), a GT 2D box that does not fit the visible object, and a real object
# with no GT box of a mapped class (false positives only).

