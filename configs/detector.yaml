imgsz: 640             # letterbox square size; swept in Phase 06
pad_value: 114
threads: 4             # torch.set_num_threads; i3-1115G4 = 2 cores / 4 threads

conf: 0.001            # evaluation threshold (COCO convention, spec 02.3)
max_det: 300
conf_operational: 0.2411  # max F1 @ IoU 0.5 on SUN val (spec 02.3 R6; eval_baseline.json)
