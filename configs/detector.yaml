# Official Ultralytics release asset, AGPL-3.0 (decision D3); 5,544,453 bytes; hash recorded 2026-11-10.
weights_url: https://github.com/ultralytics/assets/releases/download/v8.4.0/yolo26n.pt
weights_sha256: 9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef

head: one2one          # one2one = NMS-free (YOLO26 default design); one2many_nms = one-to-many branch + NMS
